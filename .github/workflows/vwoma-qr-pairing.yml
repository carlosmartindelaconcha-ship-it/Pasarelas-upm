name: VWOMA QR pairing verification
on:
  push:
    branches:
      - refactor/vwoma-qr-timing-20261115
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check pruebas/src/joint/joint-app.js
          node --check pruebas/src/joint/webrtc-transport.js
          node --check pruebas/tests/qr-pairing-timing.test.cjs
      - name: Run QR and pairing regression checks
        run: cd pruebas && node --test tests/qr-pairing-timing.test.cjs tests/hotspot-ice.test.cjs tests/record-transfer.test.cjs tests/transfer-integration.test.cjs tests/results-view.test.cjs tests/ui-events.test.cjs tests/exports.test.cjs tests/measure-guide.test.cjs tests/setup-redesign.test.cjs
