name: VWOMA automatic Hotspot ICE focused checks

on:
  push:
    branches:
      - "refactor/vwoma-hotspot-auto-20261115"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check pruebas/src/joint/hotspot-ice.js
          node --check pruebas/src/joint/webrtc-transport.js
          node --check pruebas/tests/hotspot-ice.test.cjs
      - name: Focused connection and data regression
        run: cd pruebas && node --test tests/hotspot-ice.test.cjs tests/record-transfer.test.cjs tests/transfer-integration.test.cjs tests/results-view.test.cjs tests/ui-events.test.cjs tests/exports.test.cjs tests/measure-guide.test.cjs tests/setup-redesign.test.cjs
